name = "langlib"
version = "0.1.0"
defaultTargets = ["Langlib"]
testDriver = "tests"

# cslib supplies the computability yardsticks (a single-tape Turing machine
# and an unlimited register machine) that Stage 8 states its results
# against, and Mathlib comes with it. This revision is the last one pinned
# to Lean v4.33.0, matching our toolchain exactly; bump it in step with
# lean-toolchain, never on its own.
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib.git"
rev = "3951377e5a3f5772737f11cd62bc5bb6a72f95d1"

[[lean_lib]]
name = "Langlib"
globs = ["Langlib.**"]

[[lean_exe]]
name = "tests"
root = "Langlib.Tests.Main"

[[lean_exe]]
name = "brainfuck"
root = "Langlib.Languages.Brainfuck.Main"

[[lean_exe]]
name = "turpentine"
root = "Langlib.Languages.Turpentine.Main"

[[lean_exe]]
name = "fractran"
root = "Langlib.Languages.Fractran.Main"

[[lean_exe]]
name = "subleq"
root = "Langlib.Languages.Subleq.Main"

[[lean_exe]]
name = "whitespace"
root = "Langlib.Languages.Whitespace.Main"

[[lean_exe]]
name = "ook"
root = "Langlib.Languages.Ook.Main"

[[lean_exe]]
name = "deadfish"
root = "Langlib.Languages.Deadfish.Main"

[[lean_exe]]
name = "befunge93"
root = "Langlib.Languages.Befunge93.Main"

[[lean_exe]]
name = "thue"
root = "Langlib.Languages.Thue.Main"

[[lean_exe]]
name = "malbolge"
root = "Langlib.Languages.Malbolge.Main"

[[lean_exe]]
name = "piet"
root = "Langlib.Languages.Piet.Main"

[[lean_exe]]
name = "brainloller"
root = "Langlib.Languages.Brainloller.Main"

[[lean_exe]]
name = "unlambda"
root = "Langlib.Languages.Unlambda.Main"

[[lean_exe]]
name = "ski"
root = "Langlib.Languages.Ski.Main"

[[lean_exe]]
